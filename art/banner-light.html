<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#14171C;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(201,107,16,.12),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(0,0,0,.07) 1px,transparent 0) 0 0/26px 26px,
    #EFEEE9;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#C96B10}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#5C636E;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#C96B10}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#FBFAF8;border:1px solid rgba(0,0,0,.09);border-radius:18px;
  box-shadow:0 18px 44px rgba(20,24,33,.10);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(0,0,0,.035);
  border-bottom:1px solid rgba(0,0,0,.09);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#6B7280;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.14);display:block}
.pill{background:#FFFFFF;border:1px solid rgba(0,0,0,.09);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#6B7280;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#2B303A}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#6B7280;background:rgba(0,0,0,.035);border:1px solid rgba(0,0,0,.09);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#C96B10;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:#E4F2E8;color:#1E7A3F;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:#FBE7D4;color:#AF560E}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#5C636E}
.accent{color:#C96B10}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.scene{position:relative;width:100%;display:flex;align-items:center;justify-content:center}
.float{position:absolute;background:#FBFAF8;border:1px solid rgba(0,0,0,.09);border-radius:16px;
  box-shadow:0 18px 44px rgba(20,24,33,.10);padding:14px 18px}
.toggle{width:64px;height:34px;border-radius:999px;background:#C96B10;position:relative}
.toggle i{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;
  background:#fff}
.onlbl{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#C96B10}

</style></head><body><div class="page">
<div style="display:flex;flex-direction:column;text-align:center;align-items:center;flex:0 0 auto"><h1>Cafe Guard</h1><div class="sub">A loud alarm that guards your laptop while you step away</div></div><div class="mid"><div class="scene"><svg width="430" height="286" viewBox="0 0 430 286"><g fill="none" stroke="#C96B10" stroke-width="3" opacity=".30"><ellipse cx="215" cy="150" rx="150" ry="112"/><ellipse cx="215" cy="150" rx="190" ry="140" stroke-dasharray="3 12"/></g><rect x="92" y="40" width="246" height="158" rx="13" fill="#FBFAF8" stroke="rgba(0,0,0,.09)" stroke-width="3"/><rect x="108" y="56" width="214" height="126" rx="7" fill="#F1EFEB"/><rect x="128" y="78" width="120" height="9" rx="4.5" fill="rgba(0,0,0,.15)"/><rect x="128" y="98" width="166" height="9" rx="4.5" fill="rgba(0,0,0,.15)"/><rect x="128" y="118" width="92" height="9" rx="4.5" fill="rgba(0,0,0,.15)"/><path d="M66 206 H364 L380 232 C382 238 378 244 371 244 H59 C52 244 48 238 50 232 Z" fill="#FBFAF8"/><rect x="170" y="216" width="90" height="8" rx="4" fill="rgba(0,0,0,.15)" opacity=".5"/></svg><div class="float" style="left:92px;top:14px"><div class="row" style="gap:14px"><div class="toggle"><i></i></div><div><div class="onlbl">Armed</div><div class="sub" style="font-size:12.5px;margin-top:2px">Cafe Guard is watching</div></div></div></div><div class="float" style="right:70px;bottom:10px;max-width:320px"><div class="row" style="gap:10px;margin-bottom:9px"><span class="ok warn">Charger unplugged</span><span class="chip on">Siren</span></div><div class="sub" style="font-size:13px">Full volume. The mute key does nothing. Only Windows Hello turns it off.</div></div></div></div><div class="tag" style="text-align:center;margin-top:0px;flex:0 0 auto">Step away. <span class="a">It watches.</span> Only you can turn it off.</div>
</div></body></html>
