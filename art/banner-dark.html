<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:520px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#EAF0F8;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(53,208,122,.13),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/26px 26px,
    #111A26;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#35D07A}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#8B99AD;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#35D07A}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#19222F;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.10);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8B99AD;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#8B99AD;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#D7DFEA}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#8B99AD;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#35D07A;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:rgba(63,185,80,.16);color:#4FC463;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:rgba(240,160,60,.16);color:#F0A83C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#8B99AD}
.accent{color:#35D07A}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.scene{display:flex;align-items:center;justify-content:center;gap:34px;width:100%}
.lap{flex:0 0 auto}
.cards{display:flex;flex-direction:column;gap:14px;width:300px;flex:0 0 auto}
.float{background:#19222F;border:1px solid rgba(255,255,255,.10);border-radius:16px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);padding:13px 17px}
.toggle{width:60px;height:32px;border-radius:999px;background:#35D07A;position:relative}
.toggle i{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;
  background:#fff}
.onlbl{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#35D07A}
.alarm{color:#DC2626}

</style></head><body><div class="page">
<div class="mid"><div class="scene"><img class="logo" src="../docs/images/logo.png" width="148" height="148" style="flex:0 0 auto;"><div class="lap"><svg width="408" height="272" viewBox="0 0 408 272"><g fill="none" stroke="#35D07A" stroke-width="3" opacity=".34"><ellipse cx="204" cy="142" rx="142" ry="106"/><ellipse cx="204" cy="142" rx="180" ry="132" stroke-dasharray="3 12"/></g><rect x="86" y="36" width="236" height="152" rx="13" fill="#19222F" stroke="rgba(255,255,255,.10)" stroke-width="3"/><rect x="101" y="51" width="206" height="122" rx="7" fill="rgba(255,255,255,.05)"/><rect x="120" y="72" width="116" height="9" rx="4.5" fill="rgba(255,255,255,.18)"/><rect x="120" y="92" width="160" height="9" rx="4.5" fill="rgba(255,255,255,.18)"/><rect x="120" y="112" width="88" height="9" rx="4.5" fill="rgba(255,255,255,.18)"/><path d="M62 196 H346 L361 221 C363 227 359 233 352 233 H56 C49 233 45 227 47 221 Z" fill="#19222F"/><rect x="162" y="206" width="86" height="8" rx="4" fill="rgba(255,255,255,.18)" opacity=".5"/></svg></div><div class="cards"><div class="float"><div class="row" style="gap:13px"><div class="toggle"><i></i></div><div><div class="onlbl">Armed</div><div class="sub" style="font-size:12px;margin-top:2px">Cafe Guard is watching</div></div></div></div><div class="float"><div class="row" style="gap:9px;margin-bottom:8px"><span class="ok" style="background:rgba(220,38,38,.14);color:#DC2626">Charger unplugged</span><span class="chip" style="background:#DC2626;color:#fff;border-color:transparent">Siren</span></div><div class="sub" style="font-size:12.5px">Full volume. The mute key does nothing. Only Windows Hello turns it off.</div></div></div></div></div><div class="tag" style="text-align:center;margin-top:0px;flex:0 0 auto">Step away. <span class="a">It watches.</span> Only you can turn it off.</div>
</div></body></html>
